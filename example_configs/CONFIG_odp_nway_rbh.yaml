#
# author: dts
# github: @conchoecia
# repository: @conchoecia/odp
#   date: 2022
#
# This is the example config file for odp_nway_rbh
#  - it is basically the sample config file as for odp
#
# For each run you can only pick n-way comparisons.
# In this example file, we can only specify 3-species
#  comparisons because we specified the option nways: 3
# You can pick as many species as you want as long as n >= 2
#
# The field num_permutations is the number of times the genomes
#  are shuffled to calculate the false discovery rate. Keep it to at least
#  1000000 permutations, but it is likely that doing many more than that
#  isn't useful.
#

nways: 3                 # This number should be the number of species that will be in each combination. Should match the number in analyses below.
search_method: "diamond" # this must be diamond or blastp
duplicate_proteins: "fail"    # currently only "fail" or "pass". Fail doesn't allow duplicate names or seqs
# analyses
# --------
# Each list below is one n-way comparison. An entry must contain exactly
#  `nways` species, and every species named must be defined in the `species`
#  block at the bottom of this file. Entries are listed explicitly because
#  each one is computationally expensive.
#
# Every analysis listed here automatically produces one ribbon diagram; there
#  is no separate on/off switch for plotting. The diagram is written to:
#    odp_nway_rbh/step4-ribbon_diagram/<species sorted, joined by "_">.ribbon.pdf
#  e.g. the first entry below produces SP1_SP2_SP3.ribbon.pdf
#
# The order you write the species in sets their top-to-bottom order in that
#  analysis's ribbon diagram (the file name itself always uses sorted order).
# To skip an analysis entirely (both its computation and its diagram), comment
#  the line out.
analyses:
  - ["SP1", "SP2", "SP3"]
  - ["SP2", "SP3", "SP4"]
  #- ["SP1", "SP2", "SP4"]   # commented-out entries are skipped entirely

# This is an optional field that allows you to specify the order of the chromosomes for the final ribbon diagram.
# It does this on a per-analysis basis, so there are opportunities to have different chromosome orders for different analyses.
chromosome_order:
  # The key is "_".join(sorted(analysis_list)) - you may have to think about this a bit or copy/paste from the snakemake runtime
  SP1_SP2_SP3:
    SP1:
      - chr1 # this only plots the chromosomes that are present. So be thorough.
      - chr2
    SP2:
      - scaf3
      - scaf2
      - scaf1
    SP3:
      - chrA
      - chrB


# Optional. Sets the colors of the linkage groups in the ribbon diagram.
#  color_palette selects a curated, repeatable palette. Valid values:
#    mypals25   - 25-color qualitative palette (default)
#    tableau20  - the Tableau 20 palette
color_palette: "mypals25"

# Optional. If True, linkage group colors are generated randomly instead of
#  being drawn from color_palette. Default is False.
random_colors: False


num_permutations: 1000000

species:
  SP1:
    proteins:    "/path/to/SP1.pep"
    chrom:       "/path/to/SP1.chrom"
    genome:      "/path/to/SP1.fasta"
    minscafsize: 900000

  SP2:
    proteins:    "/path/to/SP2.pep"
    chrom:       "/path/to/SP2.chrom"
    genome:      "/path/to/SP2.fasta"
    minscafsize: 1200000

  SP3:
    proteins:    "/path/to/SP3.pep"
    chrom:       "/path/to/SP3.chrom"
    genome:      "/path/to/SP3.fasta"
    minscafsize: 800000

  SP4:
    proteins:    "/path/to/SP4.pep"
    chrom:       "/path/to/SP4.chrom"
    genome:      "/path/to/SP4.fasta"
    minscafsize: 2000000
