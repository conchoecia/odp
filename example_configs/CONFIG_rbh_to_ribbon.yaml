#
# Example config.yaml file for: odp_rbh_to_ribbon
# Author: dts
# github account: @conchoecia
# link to github repo: https://github.com/conchoecia/odp
# date: 2022-2023
# license: GNU GPL https://github.com/conchoecia/odp/blob/main/LICENSE
#
# Goal: This script creates ribbon plots of genome synteny.
#
# First select which plotting order is desired for the chromosomes
#  chr_sort_order < custom | optimal-top | optimal-size | optimal-random >
#    custom         - use the custom sorting order for EVERY species in chromorder
#    optimal-top    - use the custom order for the topmost species, then optimizes everything else
#    optimal-size   - sort the top species' chromosomes by number of genes, optimize everything else
#    optimal-chr-or - use `chromorder` when possible, optimize everything else
#    optimal-random - randomly sort the chromosomes of the top species, optimize everything else
chr_sort_order: optimal-chr-or

# - If you only want to plot the significant relationships, set to False
#   - the significant lines will be 0.8
# - If you want to plot everything, set to True
#   - the significant lines will be 0.8, the faint lines will be 0.15
plot_all: True

# - If you want to plot everything, BUT, you don't want to plot the
#    black lines on the significant relationships, set to False
# - The black lines are the orthologous relationships that are on
#    chromosomes with significant homologous relationships, but have
#    not been assigned to a linkage group. This will make the resulting
#    figures easier to work with.
plot_unassigned_rbh: True

# - First type in the list of species to plot
# - In this example we plot the relationships between
#   three species with the codes "EMU", "RES", and "HCA".
#   These three species must also be present in the "species"
#   entry of the config file below.
species_order:
  - EMU
  - RES
  - HCA

# - If there are any organisms for which you would like to specify the
#   chromosome order, then this is the place to do it. The species name
#   here must match the species name in the "species" part of the config
#   file.
# - Only the chromosomes here will be plotted for this species. This is an
#   easy way to just plot a subset of chromosomes that you are interested in.
chromorder:
  EMU:
    - EMU1
    - EMU6
    - EMU5
    - EMU4
    - EMU2
    - EMU3

# NOTE : YOU CAN ONLY SPECIFY ONE OF THE FOLLOWING:
#        COMMENT OUT THE ONE YOU DO NOT USE
#  - rbh_files_in_order
#  - rbh_directory

# - This is the list of RBH files output from odp2 or another source.
# - Each RBH file contains the orthologs between species that should be
#   plotted.
# - The number of files will always be the number of species minus one.
# - Currently, only relationships that are significant with Fisher's exact
#   test will be plotted here.
rbh_files_in_order:
  - /path/to/EMU_RES_xy_reciprocal_best_hits.coloredby_BCnS_LGs.plotted.rbh
  - /path/to/HCA_RES_xy_reciprocal_best_hits.coloredby_BCnS_LGs.plotted.rbh

# If your rbh files were generated with odp, you can just supply the
#  path to the
rbh_directory: /path/to/odp/step2-figures/synteny_coloredby_BCnS_LGs/

# -----------------------------------------------------------------------------
# OPTIONAL — cosmetic / layout overrides. All defaults preserve the
# existing plot output, so omitting this entire block keeps current behavior.
# -----------------------------------------------------------------------------
#
# tree:
#   # Render a cladogram on the left of each panel; tips align with the
#   # species rows. Newick leaves must be the same set of names as
#   # `species_order`. When set, the default y-tick species labels are
#   # blanked because the tree's tip labels do that job.
#   newick: "((EMU,RES),HCA);"
#   width_in: 1.0
#   tip_label_map:        # optional display name per leaf
#     EMU: "Ephydatia muelleri"
#     RES: "Rhopilema esculentum"
#     HCA: "Hormiphora californensis"
#   tip_label_fontsize: 9
#   tip_label_style: "italic"   # "italic" | "normal"
#   lw: 1.5                     # cladogram line-width in pt
#   tip_pad_axes: 0.02          # gap between tip end and tip-label start
#
# chrom_label_rotation: 0          # degrees; 0 = horizontal (current), 90 =
#                                  # vertical (read bottom-up).
# chrom_label_fontsize_chr: 5      # fontsize for chr-coord panel chrom labels
# chrom_label_fontsize_ix:  4      # fontsize for ix-coord panel chrom labels
# chrom_capstyle: round            # null = matplotlib default; "round" /
#                                  # "butt" / "projecting".
# chrom_halo_pt: 0.28              # white halo half-width around chrom bars,
#                                  # in pt (0 = no halo).
# legend_style: "lines"            # "patches" (current) | "lines" (vertical
#                                  # line markers, echoing the ribbon look).
# panel_title_offset_in: 0.25      # vertical offset of panel titles above
#                                  # the top of each panel, in inches.
# panel_title_style:
#   fontsize: 8
#   color: "#555555"
#   italic: true
#
# figure_width_in: 7.087           # pin the figure to a paper size (here:
#                                  # 180mm single-column). When set, panel
#                                  # width is rescaled to fit. Leave unset
#                                  # to keep the current automatic sizing.
# figure_height_in: 6.77           # corresponding height. Unset = auto.
# interspecies_height_in: 0.322    # vertical spacing per species row in
#                                  # inches (default 0.5).

# - Optional: Define colors for gene name patterns in loci_of_interest
# - Uses case-insensitive substring matching for gene names
# - Genes matching longer keywords take precedence
# - Format: keyword: "#HEXCOLOR"
# - Box shapes have clipped corners indicating strand: + clips bottom-right, - clips bottom-left
color_map:
  Lab:   "#ff0000"
  Pb:    "#ff6602"
  Hox3:  "#ffcc02"
  Dfd:   "#03ff00"
  Scr:   "#008002"
  Lox5:  "#00ccff"
  Antp:  "#0000ff"
  Lox4:  "#00007f"
  Lox2:  "#cd87de"
  Post2: "#ff00ff"
  Post1: "#800280"

# - All of the species that are in "species_order" above should be here
# - This information is important for calculating some stats that are used
#   for plotting.
# - The necessary fields are:
#   - proteins
#   - chrom
#   - genome
# - If you specify "minscafsize", then only scaffolds >= this size are
#   included in the ribbon plot.
species:
  HCA:
    genus:    "Hormiphora"
    species:  "californensis"
    proteins: "/path/to/HCA.pep"
    chrom:    "/path/to/HCA.chrom"
    genome:   "/path/to/HCA.fasta"
    minscafsize: 5000000

  RES:
    # as you can see in this example, it doesn't matter if the file
    # prefixes match the species name (RES) specified above
    proteins:    "/path/to/rhopilema_chromosome_v1.pep"
    chrom:       "/path/to/rhopilema_chromosome_v1.chrom"
    genome:      "/path/to/rhopilema_chromosome_v1.fasta"
    genus:       "Rhopilema"
    species:     "esculentum"
    minscafsize: 4000000

  EMU:
    genus:     "Ephydatia"
    species:   "muelleri"
    proteins:  "/path/to/EMU.pep"
    chrom:     "/path/to/EMU.chrom"
    genome:    "/path/to/EMU.fasta"
    minscafsize: 1000000
    # Optional: Specify loci of interest for this species
    # Creates annotation page with colored boxes showing gene locations
    # File format: tab-separated with columns: gene_name scaffold strand start end
    loci_of_interest:
      Hox: /path/to/EMU_hox_genes.chrom
      OtherGenes: /path/to/EMU_other_genes.chrom